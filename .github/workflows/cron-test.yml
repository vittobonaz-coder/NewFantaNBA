name: Test Python Cron Job

# 1. Trigger schedulato (alle 11:23 UTC ogni giorno = 13:23 in Italia con l'ora legale)
# 2. Trigger manuale / via API (usato da Supabase pg_cron)
on:
  schedule:
    - cron: '01 16 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione di Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installazione dipendenze
        run: pip install requests pandas nba_api supabase

      - name: Esecuzione dello script Python
        run: python cron_test_script.py