name: Cron punteggi

# Lanciato solo da Supabase pg_cron (o a mano), con mode:
# - daily    -> ogni giorno 08:00 UTC: scarica i tabellini e aggiorna i punteggi
# - rollover -> ogni giorno 21:00 e 22:00 UTC: lavora solo il run delle 23:00 italiane (l'altro esce subito);
#               se domani inizia una nuova giornata, chiude oggi e azzera domani
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "daily oppure rollover"
        required: true
        default: daily
        type: choice
        options: [daily, rollover]

# Due run non girano mai in contemporanea
concurrency:
  group: cron-punteggi
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione di Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installazione dipendenze
        run: pip install requests pandas nba_api supabase

      - name: Esecuzione dello script Python
        run: python cron_test_script.py ${{ inputs.mode }}
