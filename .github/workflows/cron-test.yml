name: Cron punteggi

# Lanciato solo da Supabase pg_cron (o a mano), con mode:
# - daily    -> ogni giorno 08:00 UTC: scarica i tabellini e aggiorna i punteggi
# - rollover -> ogni giorno 21:59 e 22:59 UTC: lavora solo il run delle 23:59 italiane (l'altro esce subito);
#               se domani inizia una nuova giornata, chiude oggi e azzera domani
# - injuries -> ogni giorno 21:10 e 22:10 UTC: aggiorna gli infortuni da ESPN (tabella player_injuries)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "daily, rollover oppure injuries"
        required: true
        default: daily
        type: choice
        options: [daily, rollover, injuries]

# Due run dei punteggi (daily/rollover) non girano mai in contemporanea. Gli infortuni hanno un gruppo
# a parte: non toccano le formazioni e così non possono far cancellare un rollover in coda
# (GitHub tiene in coda un solo run per gruppo e cancella quello in attesa se ne arriva un altro).
concurrency:
  group: ${{ inputs.mode == 'injuries' && 'cron-infortuni' || 'cron-punteggi' }}
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione di Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installazione dipendenze
        run: pip install requests pandas nba_api supabase

      - name: Esecuzione dello script Python
        run: python cron_test_script.py ${{ inputs.mode }}
