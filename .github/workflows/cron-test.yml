name: Test Python Cron Job

# 1. Trigger schedulato (alle 17:00 UTC ogni giorno)
# 2. Trigger manuale per test immediato (fondamentale!)
on:
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione di Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Esecuzione dello script Python
        run: python cron_test_script.py